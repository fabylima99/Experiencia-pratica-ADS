<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Cadastro</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        <link rel="stylesheet" href="css/styles.css">
    </head>

    <body>
        <header><h1>Cadastro</h1></header>

        <nav>
            <ul>
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
                <li><a href="projetos.html">Projetos</a></li>
            </ul>
        </nav>

        <main>
            <section id="form">
                <h2>Formulário de Cadastro</h2>
                <p>Preencha os campos abaixo para se cadastrar em nossa ONG:</p>

                <form>
                    <fieldset>
                        <legend>Dados Pessoais</legend>

                        <label for="nome-completo">Nome completo:</label>
                        <input type="text" id="nome-completo" name="nome-completo" required placeholder="Digite seu nome completo"><br><br>

                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required placeholder="Digite seu email"><br><br>

                        <label for="data-de-nascimento">Data de nascimento:</label>
                        <input type="date" id="data-de-nascimento" name="data-de-nascimento" required><br><br>

                        <label for="CPF">CPF:</label>
                        <input type="text" id="CPF" name="CPF" required pattern="[0-9]{3}.[0-9]{3}.[0-9]{3}-[0-9]{2}" placeholder="Digite seu CPF"><br><br>

                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="telefone" required pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}" placeholder="Digite seu telefone"><br><br>
                    </fieldset>

                    <fieldset>
                        <legend>Cadastro de endereço</legend>

                        <label for="rua">Rua:</label>
                        <input type="text" id="rua" name="rua" required placeholder="Digite o nome da rua"><br><br>

                        <label for="numero">Número:</label>
                        <input type="text" id="numero" name="numero" required placeholder="Digite o número"><br><br>

                        <label for="complemento">Complemento (opcional):</label>
                        <input type="text" id="complemento" name="complemento" placeholder="Digite o complemento"><br><br>

                        <label for="bairro">Bairro:</label>
                        <input type="text" id="bairro" name="bairro" required placeholder="Digite o bairro"><br><br>

                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" name="cidade" required placeholder="Digite a cidade"><br><br>

                        <label for="estado">Estado:</label>
                        <input type="text" id="estado" name="estado" required placeholder="Digite o estado"><br><br>

                        <label for="cep">CEP:</label>
                        <input type="text" id="cep" name="cep" required pattern="[0-9]{5}-[0-9]{3}" placeholder="Digite o CEP"><br><br>
                    </fieldset>

                    <input type="submit" class="btn btn-primary mt-3" value="Cadastrar">
                </form>
            </section>
        </main>

        <footer></footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <script type="module" src="js/main.js"></script>
    </body>
</html>
